name: Run Tests on Commit

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tests/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore Xreeple.Bukalemun.sln

      - name: Build
        run: dotnet build Xreeple.Bukalemun.sln --no-restore --configuration Release

      - name: Run tests
        run: dotnet test Xreeple.Bukalemun.sln --no-build --configuration Release --verbosity normal
